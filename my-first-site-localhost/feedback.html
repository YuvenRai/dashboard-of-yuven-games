<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090714">
  <title>Send a note · DJ Click Deck</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8f5ed;
      background:
        radial-gradient(ellipse at 18% 22%, rgb(0 229 255 / 14%), transparent 30%),
        radial-gradient(ellipse at 82% 28%, rgb(255 39 173 / 13%), transparent 32%),
        radial-gradient(ellipse at 50% 100%, #211331, #090714 68%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 1.25rem;
      display: grid;
      place-items: center;
    }

    main {
      width: min(100%, 34rem);
      padding: clamp(1.5rem, 6vw, 3rem);
      border: 1px solid rgb(178 118 255 / 22%);
      border-radius: 24px;
      background: linear-gradient(145deg, rgb(255 255 255 / 6%), rgb(16 10 32 / 90%));
      box-shadow: 0 28px 90px rgb(0 0 0 / 55%);
    }

    h1 {
      margin-top: 0;
      color: #73f7ff;
      font-size: clamp(1.7rem, 7vw, 2.3rem);
    }

    p {
      color: #c5bdd3;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 1.25rem 0 0.5rem;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 10rem;
      padding: 0.8rem;
      border: 1px solid rgb(115 247 255 / 45%);
      border-radius: 10px;
      color: #f8f5ed;
      background: #100d1a;
      font: inherit;
      resize: vertical;
    }

    button,
    .back-link {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 10px;
      color: #090714;
      background: #73f7ff;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    button:focus-visible,
    textarea:focus-visible,
    .back-link:focus-visible {
      outline: 3px solid #ff52ce;
      outline-offset: 3px;
    }

    [role="status"] {
      min-height: 1.5em;
      overflow-wrap: anywhere;
      color: #ff7a73;
    }

    .website-field {
      position: absolute;
      left: -10000px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <main>
    <h1>Write a note to us</h1>
    <p>This will not open your game or disable your lockout, but it will let us know if we made a mistake.</p>
    <form id="feedbackForm">
      <div class="website-field" aria-hidden="true">
        <label for="website">Leave this field blank</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <label for="note">Your note</label>
      <textarea id="note" name="note" maxlength="2000" required></textarea>
      <button id="sendButton" type="submit">Send note</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back-link" href="index.html">Back to DJ Click Deck</a>
  </main>
  <script>
    const feedbackForm = document.getElementById("feedbackForm");
    const noteInput = document.getElementById("note");
    const websiteInput = document.getElementById("website");
    const sendButton = document.getElementById("sendButton");
    const status = document.getElementById("status");

    function createNotePdf(note) {
      const pageWidth = 816;
      const pageHeight = 1056;
      const margin = 72;
      const lineHeight = 28;
      const contentWidth = pageWidth - margin * 2;
      const canvas = document.createElement("canvas");
      canvas.width = pageWidth;
      canvas.height = pageHeight;
      const context = canvas.getContext("2d");
      if (!context) {
        throw new Error("Your browser could not create the PDF.");
      }

      context.font = '20px system-ui, -apple-system, "Segoe UI", sans-serif';
      const lines = [];
      for (const paragraph of note.split(/\r?\n/)) {
        if (!paragraph) {
          lines.push("");
          continue;
        }
        let line = "";
        for (const word of paragraph.split(/\s+/u)) {
          const candidate = line ? `${line} ${word}` : word;
          if (context.measureText(candidate).width <= contentWidth) {
            line = candidate;
            continue;
          }
          if (line) {
            lines.push(line);
            line = "";
          }
          for (const character of Array.from(word)) {
            if (context.measureText(line + character).width > contentWidth && line) {
              lines.push(line);
              line = "";
            }
            line += character;
          }
        }
        lines.push(line);
      }

      const linesPerPage = Math.floor((pageHeight - margin - 150) / lineHeight);
      const pages = [];
      for (let start = 0; start < lines.length; start += linesPerPage) {
        context.fillStyle = "#ffffff";
        context.fillRect(0, 0, pageWidth, pageHeight);
        context.fillStyle = "#171322";
        context.font = 'bold 28px system-ui, -apple-system, "Segoe UI", sans-serif';
        context.fillText("DJ Click Deck feedback note", margin, margin + 28);
        context.font = '20px system-ui, -apple-system, "Segoe UI", sans-serif';
        const pageLines = lines.slice(start, start + linesPerPage);
        pageLines.forEach((line, index) => {
          context.fillText(line, margin, margin + 88 + index * lineHeight);
        });
        const encodedImage = canvas.toDataURL("image/jpeg", 0.92).split(",")[1];
        const imageBytes = Uint8Array.from(atob(encodedImage), (character) => character.charCodeAt(0));
        pages.push(imageBytes);
      }

      const encoder = new TextEncoder();
      const ascii = (text) => encoder.encode(text);
      const chunks = [
        new Uint8Array([37, 80, 68, 70, 45, 49, 46, 52, 10, 37, 226, 227, 207, 211, 10])
      ];
      const offsets = [0];
      let byteLength = chunks[0].length;
      const add = (bytes) => {
        chunks.push(bytes);
        byteLength += bytes.length;
      };
      const pageObjectNumbers = pages.map((_, index) => 3 + index * 3);
      const objects = [
        ascii("<< /Type /Catalog /Pages 2 0 R >>"),
        ascii(`<< /Type /Pages /Kids [${pageObjectNumbers.map((number) => `${number} 0 R`).join(" ")}] /Count ${pages.length} >>`)
      ];

      for (let index = 0; index < pages.length; index += 1) {
        const pageObject = pageObjectNumbers[index];
        const contentObject = pageObject + 1;
        const imageObject = pageObject + 2;
        const content = ascii("q 612 0 0 792 0 0 cm /Im0 Do Q");
        objects.push(
          ascii(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 ${imageObject} 0 R >> >> /Contents ${contentObject} 0 R >>`),
          new Uint8Array([...ascii(`<< /Length ${content.length} >>\nstream\n`), ...content, ...ascii("\nendstream")]),
          new Uint8Array([...ascii(`<< /Type /XObject /Subtype /Image /Width ${pageWidth} /Height ${pageHeight} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pages[index].length} >>\nstream\n`), ...pages[index], ...ascii("\nendstream")])
        );
      }

      objects.forEach((object, index) => {
        offsets.push(byteLength);
        add(ascii(`${index + 1} 0 obj\n`));
        add(object);
        add(ascii("\nendobj\n"));
      });

      const crossReferenceOffset = byteLength;
      add(ascii(`xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`));
      for (const offset of offsets.slice(1)) {
        add(ascii(`${String(offset).padStart(10, "0")} 00000 n \n`));
      }
      add(ascii(`trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${crossReferenceOffset}\n%%EOF`));

      const pdf = new Uint8Array(byteLength);
      let position = 0;
      for (const chunk of chunks) {
        pdf.set(chunk, position);
        position += chunk.length;
      }
      return new Blob([pdf], { type: "application/pdf" });
    }

    feedbackForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!feedbackForm.reportValidity()) {
        return;
      }

      sendButton.disabled = true;
      try {
        const note = noteInput.value.trim();
        const file = createNotePdf(note);
        const downloadUrl = URL.createObjectURL(file);
        const downloadLink = document.createElement("a");
        downloadLink.href = downloadUrl;
        downloadLink.download = "mistake-note-djclickdeck-feedback.pdf";
        document.body.append(downloadLink);
        downloadLink.click();
        downloadLink.remove();
        window.setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        feedbackForm.hidden = true;
        status.textContent = "Your note was downloaded as mistake-note-djclickdeck-feedback.pdf. It was not sent online. This does not unlock your game or change the lockout.";
      } catch (error) {
        status.textContent = error instanceof Error
          ? `Could not download your note: ${error.message}`
          : "Could not download your note. Please try again.";
        sendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
